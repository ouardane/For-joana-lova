<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

            </div>
            <p class="password-hint" id="password-hint"></p>
            <p class="password-clue">💙 You know the word... it's where everything began 🌙</p>
        </div>
    </div>
    <div id="main-site" style="display:none;"></div>
    <script src="encrypted-content.js"></script>
